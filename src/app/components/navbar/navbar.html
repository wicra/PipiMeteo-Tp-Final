<nav class="navbar" aria-label="Navigation principale">
  <a class="navbar__brand" routerLink="/home">
    <app-logo [size]="32" />
    <span class="navbar__title">PipiMeteo</span>
  </a>

  @if (showSearch()) {
    <div class="navbar__search">
      <app-search />
    </div>
  }

  <ul class="navbar__links">
    <li>
      <a routerLink="/home" routerLinkActive="navbar__link--active" class="navbar__link">Accueil</a>
    </li>
    <li>
      <a routerLink="/about" routerLinkActive="navbar__link--active" class="navbar__link"
        >À propos</a
      >
    </li>
  </ul>

  <div class="navbar__local-weather" aria-live="polite">
    @if (localWeatherLoading()) {
      <span class="navbar__local-weather-loading">Localisation en cours…</span>
    } @else if (localWeather(); as weather) {
      <span class="navbar__local-weather-value">{{ weather.city }} · {{ weather.temperature }}°C</span>
    }
  </div>
</nav>
