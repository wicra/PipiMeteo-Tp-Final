<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <label for="city">Ville</label>
  <input id="city" type="text" formControlName="city" placeholder="Paris" autocomplete="off" />
  <button type="submit">Rechercher</button>

  @if (submitted() && isCityMissing) {
    <p role="alert">Veuillez saisir une ville.</p>
  }
</form>
